  title: QIPS Artifact Register
  version: 1.0.0
  owner: W09
  status: ACTIVE
  authority_class: APPROVED_PROJECT_CONTENT
  coverage_rule: Active artifact classes and canonical containers are registered here; file-level human-editable documents remain in documents/register.yaml.

artifacts:
