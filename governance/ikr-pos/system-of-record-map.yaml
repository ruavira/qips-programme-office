  - approved_artifact
  - source_commit_recorded
  - publication_authorized
- id: SYS-VERCEL
  name: Vercel
  identifier: null
  role: FUTURE_DEPLOYMENT_SURFACE
  status: NOT_REGISTERED
  layers:
  - PUBLISHED_APPLICATION_OR_SERVICE
  activation_gates:
  - project_identifier_registered
  - approved_artifact
  - source_commit_recorded
  - publication_authorized
- id: SYS-CHAT
  name: AI chats and agent workspaces
  identifier: replaceable
  role: EPHEMERAL_WORKER_CONTEXT
  layers: []
  authority_rule: No critical state may exist only in chat.
  prohibited:
  - sole_decision_record
  - sole_artifact_location
  - uncommitted_canon
