- id: F024
  statement: Tuition is a parameter. A published ladder by World Bank income band is the recommended structure;
    the level is not settled.
  status: PARAMETER
  owner: W16
  source: Council recommendation 2026-07-28, NOT APPROVED · reclassified to PARAMETER 2026-08-01 by programme director,
    for CCC ratification · PARAMETER status and declared range ratified by the CCC on 2026-08-01, Item 6 (minute
    ccc/minutes/2026-08-01.md)
  established: 2026-07-28
  parameter:
    range: LMIC individual USD 450-600, working figure USD 500, with the international, UMIC, institutional and
      LIC rungs scaling from it. Narrowed by the CCC on 2026-08-01, Item 6, from USD 400-900. USD 500 is the only
      point inside the committed self-pay bands of all three candidate markets and under all three ceilings (Nigeria
      USD 294-661, ceiling ~USD 600 at WACP fellowship-exam parity; Ghana USD 530-970; Pakistan USD 270-540). The
      former USD 700-900 band sits above Pakistan's ceiling and at or above Nigeria's, and moves to the institutional
      rung.
    design_valid_across_range: true
    why: 'No hour of curriculum, assessment or observership depends on the price. Recommended ladder, published
      openly on World Bank income bands after the ISQua precedent: individual LMIC USD 500; institutional per seat
      USD 900 with 15% off at 3 seats and 25% at 10; international USD 1,500; hardship USD 250. Payable in four
      quarterly instalments with progression gated on payment, priced in USD and published in three local currencies
      after the West African College of Physicians precedent. Evidence: workstreams/W16/working/W16-faculty-economics-and-pricing-recommendation-2026-08-01.md.'
    gates: Marketing copy (W14) · application form (W07) · viability arithmetic (W16) · F026 indemnity trigger
    does_not_gate: Programme design does not depend on this. Nothing is published until it is decided.
    decide_by: Before any price is published
  ratified_on: '2026-08-01'

- id: F025
  statement: Cohort 1 size is a parameter. A viability floor and a delivery ceiling are declared; the target is
    not settled.
  status: PARAMETER
  owner: W07
  source: Council recommendation 2026-07-28, NOT APPROVED · reclassified to PARAMETER 2026-08-01 by programme director,
    for CCC ratification · PARAMETER status and declared range ratified by the CCC on 2026-08-01, Item 6 (minute
    ccc/minutes/2026-08-01.md)
  established: 2026-07-28
  parameter:
    range: 25 to 64 participants. Target 40, floor 24, ceiling 64 — set by the CCC on 2026-08-01, Item 6. Coaching
      runs in groups of eight and each group is a stepped cost, not a smooth one, so the economically clean sizes
      are 24, 32, 40, 48, 56 and 64. A cohort off a multiple of eight pays for a coaching group it does not fill.
    design_valid_across_range: true
    why: The monthly cycle, coaching group size of 8 and assessment model hold across the whole range; only the
      number of coaching groups and host-site places change. Published break-even evidence puts the fixed-cost floor
      far below this range (7 participants web-delivered in the only published health-professional break-even analysis;
      15 in the only published institutional viability rule), so the risk sits in the allowance-and-travel-heavy
      variable block, not the fixed block.
    gates: Coaching group count (W06) · host-site capacity required (W04) · viability (W16)
    does_not_gate: Curriculum, assessment and observership design do not depend on this.
    decide_by: At the go/no-go gate
  ratified_on: '2026-08-01'

- id: F026
  statement: If verified per-learner indemnity exceeds USD 75, the observership defers to cohort 2 and the LMIC
    individual tuition rung drops to the floor of its declared F024 range.
  status: APPROVED
  owner: W16
  source: Council conditional ruling 2026-07-28 · APPROVED WITH AMENDMENT by the CCC on 2026-08-01, Item 7 (minute
    ccc/minutes/2026-08-01.md).
  established: '2026-08-01'
  amendment_note: 'Two amendments. First, the original stated a hard-coded LMIC price of USD 475, derived from the
    2026-07-28 council recommendation rather than from the pricing evidence base. It is restated as a rule relative
    to F024 so that it cannot silently contradict F024 once tuition settles. Second, the USD 75 threshold is a decision
    threshold chosen by the committee, NOT an evidenced benchmark: published per-learner indemnity figures were
    NOT FOUND for Nigeria, Ghana or Pakistan. Recorded so nobody later mistakes it for a market figure. Q001 remains
    the open question that makes this rule testable.'
  threshold_basis: COMMITTEE_CHOSEN_NOT_EVIDENCED

- id: F027
  statement: 'Go/no-go kill date is 20 November 2026: 40 paid deposits, 9 signed host-site MoUs, 12 consented faculty,
    all three at once.'
  status: PROPOSED
  owner: W17
  source: Council recommendation 2026-07-28, NOT APPROVED · DEFERRED 2026-08-01, see deferral_reason
  established: 2026-07-28
  deferred_on: '2026-08-01'
  deferral_reason: 'DEFERRED by the CCC on 2026-08-01, Item 7, and returned to W17. Two conflicts with decisions
    already approved, both of which the next version must resolve rather than re-propose. (1) DATE COLLISION. F012
    is approved canon: applications close 31 December 2026. F027 requires 40 paid deposits by 20 November 2026,
    forty-one days before the window closes. W07-01, approved at Item 4 of the same sitting, adopted eligibility
    screening then two independent scores then moderation then offers. A moderated selection over a closed field
    cannot yield 40 paid deposits six weeks before the field closes; only rolling first-qualified offers could,
    and that is the Option A the council rejected. (2) FACULTY BACKUP CONFLICT. F027 asks for 12 consented faculty.
    W05-01 condition 3, approved at Item 3, requires every required slot to hold a primary and a backup or an approved
    risk treatment. Twelve consented faculty gives twelve primaries and no backups. Either the figure rises, or
    the fact states twelve primaries plus an approved risk treatment for backup coverage.'

