- id: F017
  statement: Brand identity is a parameter. A mix of RCI and SQHN assets is in use pending a settled identity.
  status: PARAMETER
  owner: W13
  source: Owner decision 2026-07-28, item 18 · reclassified to PARAMETER 2026-08-01 by programme director,
    for CCC ratification
  established: 2026-07-28
  parameter:
    range: RCI-led | SQHN-led | co-branded (current working position)
    design_valid_across_range: true
    why: No element of programme design depends on the visual identity.
    gates: Collateral production (W14) · naming architecture (W13)
    does_not_gate: Curriculum, assessment, observership and operations do not depend on this.
    decide_by: Before collateral is printed

- id: F018
  statement: Admissions criteria are a parameter to be set by W07 on best practice. Eligibility breadth
    is not yet fixed.
  status: PARAMETER
  owner: W07
  source: Owner decision 2026-07-28, item 15 · reclassified to PARAMETER 2026-08-01 by programme director,
    for CCC ratification
  established: 2026-07-28
  parameter:
    range: clinical only | clinical and non-clinical | open with experience floor
    design_valid_across_range: true
    why: The programme is designed for a mixed clinical and managerial cohort; narrowing eligibility removes
      participants, not content.
    gates: Application form (W07) · marketing claims (W14) · cohort composition
    does_not_gate: Curriculum and assessment do not depend on this.
    decide_by: Before the application form is published

- id: F019
  statement: Published time commitment is about 4 hours a week in an ordinary week and about 228 hours
    in total, derived from the curriculum rather than chosen for marketing.
  status: APPROVED
  owner: W02
  source: Owner decision 2026-07-28, item 5
  established: 2026-07-28

- id: F020
  statement: The cohort 1 country set is a deployment parameter. Nigeria is the anchor market; Ghana and
    Pakistan are candidates, not commitments.
  status: PARAMETER
  owner: W01
  source: Programme positioning, decisions-log · reclassified to PARAMETER 2026-08-01 by programme director,
    for CCC ratification
  established: 2026-07-28
  parameter:
    range: '[Nigeria] | [Nigeria, Ghana] | [Nigeria, Ghana, Pakistan]'
    design_valid_across_range: true
    why: The curriculum teaches improvement methods applied in the participant's own facility, so it is
      country-agnostic by construction.
    gates: CPD recognition routes (W03) · payment rails (W16) · calendar collisions (W10) · marketing
      reach (W14)
    does_not_gate: Curriculum, assessment design and observership design do not depend on this.
    decide_by: Before applications open

- id: F021
