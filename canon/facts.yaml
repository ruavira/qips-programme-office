- id: F024
  statement: Tuition is a parameter. A published ladder by World Bank income band is the recommended structure;
    the level is not settled.
  status: PARAMETER
  owner: W16
  source: Council recommendation 2026-07-28, NOT APPROVED · reclassified to PARAMETER 2026-08-01 by programme
    director, for CCC ratification
  established: 2026-07-28
  parameter:
    range: LMIC individual USD 400-900, with the international, UMIC, institutional and LIC rungs scaling
      from it
    design_valid_across_range: true
    why: No hour of curriculum, assessment or observership depends on the price.
    gates: Marketing copy (W14) · application form (W07) · viability arithmetic (W16)
    does_not_gate: Programme design does not depend on this. Nothing is published until it is decided.
    decide_by: Before any price is published

- id: F025
  statement: Cohort 1 size is a parameter. A viability floor and a delivery ceiling are declared; the
    target is not settled.
  status: PARAMETER
  owner: W07
  source: Council recommendation 2026-07-28, NOT APPROVED · reclassified to PARAMETER 2026-08-01 by programme
    director, for CCC ratification
  established: 2026-07-28
  parameter:
    range: 25 to 64 participants
    design_valid_across_range: true
    why: The monthly cycle, coaching group size of 8 and assessment model hold across the whole range;
      only the number of coaching groups and host-site places change.
    gates: Coaching group count (W06) · host-site capacity required (W04) · viability (W16)
    does_not_gate: Curriculum, assessment and observership design do not depend on this.
    decide_by: At the go/no-go gate

