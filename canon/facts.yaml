- id: F007
  statement: Observership site geography is a deployment parameter. The 40-hour observership is delivered at a site
    qualified against the Host Site Standard; travel and accommodation are met by the participant or their sponsoring
    organisation.
  status: PARAMETER
  owner: W04
  source: Owner decision 2026-07-28, item 12 · reclassified to PARAMETER 2026-08-01 by programme director, for CCC
    ratification · PARAMETER status and declared range ratified by the CCC on 2026-08-01, Item 6 (minute ccc/minutes/2026-08-01.md)
  established: 2026-07-28
  parameter:
    range: own city | own country | any qualified site within the cohort country set
    design_valid_across_range: true
    why: 'The 40 contact hours, the structured instruments, the portfolio and the assessment of the participant''s
      own analysis are identical at any qualified site. Note for whoever decides this: it is not an administrative
      parameter. The in-person component accounted for 67-87% of total implementation cost in the closest African
      blended-training costing study, and per diems, accommodation and travel were 30-40% of implementer direct
      cost. This is the largest single determinant of whether the unit economics work. Evidence: workstreams/W16/working/W16-self-sustainability-mechanics-2026-08-01.md.'
    gates: Travel cost (W16) · indemnity jurisdiction (W17) · host-site recruitment footprint (W04)
    does_not_gate: Observership pedagogy, the Host Site Standard, and capstone assessment do not depend on this.
    decide_by: Before host-site MoUs are signed
  ratified_on: '2026-08-01'

