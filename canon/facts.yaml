# CANON — the fact registry.
# The single source of truth for what has been established about this programme.
#
# STATUS values:
#   APPROVED   the coordinating committee has ratified it. Binding on every workstream.
#   PARAMETER  deliberately left open, with a declared range. The design is valid across the
#              whole range, so no workstream is blocked by it. Carries what it gates and what
#              it does not. This is a decision to stay flexible, not an absence of a decision.
#   PROPOSED   a workstream or council recommends it. NOT binding. Never publish it.
#   SUPERSEDED replaced by a later fact. Kept for provenance. Never deleted.
#
# Only two things write to this file: a CCC decision, and a supersession recorded by the CCC.
# No workstream may edit it directly.
# Last promotion: 2026-07-28

facts:
- id: F001
  statement: The programme is a 12-month hybrid professional programme, not a course.
  status: APPROVED
  owner: W02
  source: Owner decision, decisions-log D4/D5
  established: 2026-07-28

- id: F002
  statement: It is never described using the words course, class, lesson, student or module.
  status: APPROVED
  owner: W13
  source: Owner decision, decisions-log D4
  established: 2026-07-28

- id: F003
  statement: 'The unit of the programme is the month: one eLearning release, one live faculty session,
    one small-group coaching call, one artefact.'
  status: APPROVED
  owner: W02
  source: Owner decision, decisions-log; governing design principle
  established: 2026-07-28

- id: F004
  statement: Artefacts are submitted four days before the coaching call so the coach arrives having read
    them.
  status: APPROVED
  owner: W02
  source: Programme architecture spec
  established: 2026-07-28

- id: F005
  statement: Coaching is monthly, in small groups, on Zoom.
  status: APPROVED
  owner: W06
  source: Owner decision, decisions-log D5 as amended
  established: 2026-07-28

- id: F006
  statement: The programme carries a 40-hour observership from month 3 to week 2 of month 4.
  status: APPROVED
  owner: W04
  source: Owner decision 2026-07-28, item 11
  established: 2026-07-28

- id: F007
  statement: Observership site geography is a deployment parameter. The 40-hour observership is delivered
    at a site qualified against the Host Site Standard; travel and accommodation are met by the participant
    or their sponsoring organisation.
  status: PARAMETER
  owner: W04
  source: Owner decision 2026-07-28, item 12 · reclassified to PARAMETER 2026-08-01 by programme director,
    for CCC ratification
  established: 2026-07-28
  parameter:
    range: own city | own country | any qualified site within the cohort country set
    design_valid_across_range: true
    why: The 40 contact hours, the structured instruments, the portfolio and the assessment of the participant's
      own analysis are identical at any qualified site.
    gates: Travel cost (W16) · indemnity jurisdiction (W17) · host-site recruitment footprint (W04)
    does_not_gate: Observership pedagogy, the Host Site Standard, and capstone assessment do not depend
      on this.
    decide_by: Before host-site MoUs are signed

- id: F008
  statement: Host sites are qualified against a published Host Site Standard derived from programme objectives,
    not from the characteristics of candidate sites.
  status: APPROVED
  owner: W04
  source: Owner decision, decisions-log
  established: 2026-07-28

- id: F009
  statement: Coaching capability is built internally rather than bought in.
  status: APPROVED
  owner: W06
  source: Owner decision 2026-07-28, item 13
  established: 2026-07-28

- id: F010
