    material for cohort 1. The identified partner set is held in the restricted programme record and may be named
    only by a later CCC decision. The word consortium is retired.
  status: APPROVED
  owner: W15
  source: CCC sitting 2026-08-01, ruling of the programme director. Supersedes F015.
  established: '2026-08-01'
  supersedes: F015

