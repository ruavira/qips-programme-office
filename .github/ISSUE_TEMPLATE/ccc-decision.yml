name: CCC decision
description: Put a decision-ready dossier before the Central Coordinating Committee.
title: "[CCC] "
labels: ["ccc-decision"]
body:
  - type: input
    id: dossier
    attributes:
      label: Dossier
      placeholder: W16-01
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision requested
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Genuine options and recommendation
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Dossier, verification and Drive links
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: CCC verdict
      options:
        - PENDING
        - APPROVE
        - AMEND
        - REJECT
        - DEFER
    validations:
      required: true
