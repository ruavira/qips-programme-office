name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  programme-office:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Rebuild the generated control room
        run: |
          python engine/agenda.py
          python engine/controlroom.py
      - name: Validate IKR-POS governance profile
        run: |
          python -m py_compile engine/validate_ikr_pos.py
          python engine/validate_ikr_pos.py
      - name: Self-test the decision-capture engine
        run: |
          python -m py_compile engine/decision_capture.py
          python engine/decision_capture.py --self-test
      - name: Admissions engine end-to-end test (W07-01 condition 5)
        run: |
          python -m py_compile engine/admissions.py
          python engine/admissions.py --self-test
      - name: Verify generated files are committed
        run: git diff --exit-code -- ccc/agenda.md ccc/control-room.html
      - name: Reject accidentally committed secrets and environment files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)'; then
            echo 'Environment files must not be committed.'
            exit 1
          fi
          if git grep -I -n -E '(github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':!*.lock'; then
            echo 'Possible credential detected.'
            exit 1
          fi
