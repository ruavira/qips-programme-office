# The cohort-one application instrument, as data.
#
# This is the BLANK instrument. No applicant data may ever be committed to this repository —
# names, contact details, identity and qualification files, adjustment information, references,
# employer details and reviewer notes belong in an approved restricted system. SECURITY.md and
# AGENTS.md both forbid participant personal data here, and this file is public.
#
# Rendered by whatever surface serves it. The field definitions are the contract; the surface is
# replaceable. That is deliberate — the same schema shape drives the CCC decision form, so the
# work of building one renders the other.
#
# Approved as architecture by the CCC on 2026-08-01, Item 4.

form:
  id: QIPS-ADM-FORM
  version: "1.0.0"
  status: DRAFT_PENDING_END_TO_END_DRY_RUN
  opens: 2026-10-01      # F012
  closes: 2026-12-31     # F012
  dossier: W07-01
  minute: ccc/minutes/2026-08-01.md

  # Deliberately absent, and each absence traces to a parameter that is not yet decided.
  omissions:
    price: F024 is a PARAMETER. No fee appears until it is decided and approved for publication.
    country_list: >-
      F020 is a PARAMETER. The country field is free-entry plus an eligibility check resolved at
      review time from canon, NOT a hardcoded dropdown of three countries.
    eligibility_floor: >-
      F018 is a PARAMETER — clinical only, clinical and non-clinical, or open with an experience
      floor. The eligibility rules are held in `eligibility_policy` below and swapped as a unit
      when F018 resolves. The rest of the form is unaffected by which option is chosen.
    partner_names: F028. No partner organisation is named anywhere in this instrument.
    cohort_size: F025 is a PARAMETER. The form states no number of places.

# ---------------------------------------------------------------------------
sections:

  - id: S1
    name: Who you are
    note: Restricted personal data. Stored outside this repository. Never scored.
    fields:
      - {id: full_name,        type: text,   required: true,  scores: false, restricted: true}
      - {id: email,            type: email,  required: true,  scores: false, restricted: true}
      - {id: phone,            type: phone,  required: true,  scores: false, restricted: true,
         note: "International format. Validation must accept every country in the F020 range and must not hardcode a national pattern."}
      - {id: country_of_practice, type: text, required: true, scores: false,
         note: "Free entry. Eligibility resolved at review time against the F020 country set as it then stands."}
      - {id: profession,       type: select, required: true,  scores: false,
         options: [medicine, nursing, midwifery, pharmacy, laboratory_science, allied_health, health_management, other]}
      - {id: job_title,        type: text,   required: true,  scores: false,
         note: "NON-SCORING. Collected for cohort description only. Promoted fact, CCC 2026-08-01: prestige is not merit."}
      - {id: institution,      type: text,   required: false, scores: false,
         note: "NON-SCORING. Optional — absence of an institution is not a disqualification."}

  - id: S2
    name: Your improvement challenge
    scores_criterion: C2
    fields:
      - {id: challenge_description, type: long_text, required: true, scores: true, max_words: 500,
         prompt: "Describe the service or system problem, who experiences it, what evidence you have, the setting and team you have lawful access to, what is realistically changeable in twelve months, and what is outside your control."}
      - {id: no_patient_data_declaration, type: checkbox, required: true, scores: false,
         prompt: "I confirm this response contains no patient-identifiable information."}

  - id: S3
    name: Initiative and follow-through
    scores_criterion: C3
    fields:
      - {id: followthrough_example, type: long_text, required: true, scores: true, max_words: 400,
         prompt: "One specific example of work you sustained or completed: your role, the constraints, what you did, evidence of follow-through, what changed, what did not, and what you learned."}
      - {id: verifying_contact, type: text, required: false, scores: false, restricted: true,
         note: "Claims may be verified with a named responsible contact. Absence does not reduce the score; it changes the evidence gate state."}

  - id: S4
    name: Your completion plan
    scores_criterion: C4
    fields:
      - {id: ordinary_week_plan, type: long_text, required: true, scores: true, max_words: 300,
         prompt: "How roughly four hours in an ordinary week will work for you."}
      - {id: live_session_feasibility, type: long_text, required: true, scores: true, max_words: 200}
      - {id: observership_route, type: long_text, required: true, scores: true, max_words: 250,
         prompt: "How you would complete a 40-hour observership at a qualified site, and any travel implications."
         }
      - {id: protected_time_undertaking, type: long_text, required: true, scores: true, max_words: 250,
         prompt: "An employer protected-time undertaking, or an equivalent plan if you are independent or self-employed."}

  - id: S5
    name: Reflection and contribution
    fields:
      - {id: reflection, type: long_text, required: true, scores: true, max_words: 350, scores_criterion: C5}
      - {id: contribution, type: long_text, required: true, scores: true, max_words: 300, scores_criterion: C6,
         prompt: "How learning could reach a team, a service or an underserved setting — and by what mechanism."}

  - id: S6
    name: Support you would need
    note: >-
      W07-01 condition 8. This section is EXCLUDED from the rubric and from moderation. It exists
      so the programme knows in December what it must resource in February, rather than
      discovering it in June. Reviewers do not see it. Completion evidence from comparable blended
      programmes shows sharply asymmetric completion by profession, and the remedy is resourcing,
      not selection.
    excluded_from_scoring: true
    excluded_from_moderation: true
    hidden_from_reviewers: true
    fields:
      - {id: support_needs, type: long_text, required: false, scores: false, restricted: true}
      - {id: reasonable_adjustment_request, type: long_text, required: false, scores: false, restricted: true,
         note: "Where an adjustment is requested, C4 is assessed on the ADJUSTED plan. Reviewers must not score an unadjusted hypothetical version of the applicant."}
      - {id: bandwidth_constraint, type: select, required: false, scores: false,
         options: [none, intermittent, low_bandwidth_only, mobile_only]}

  - id: S7
    name: How you are applying
    fields:
      - {id: source, type: select, required: true, scores: false,
         options: [open_application, institutional_nomination]}
      - {id: nominating_institution, type: text, required: false, scores: false, restricted: true,
         shown_when: "source == institutional_nomination"}
      - id: institutional_seat_terms_acknowledged
        type: checkbox
        required: false
        scores: false
        shown_when: "source == institutional_nomination"
        prompt: >-
          I understand that an institutional seat is transferable within the institution and is
          not guaranteed to a named nominee. Nomination does not affect the merit score, and a
          nominee who does not meet the standard may be replaced by another.
        note: >-
          W07-01 condition 6. This must be acknowledged in writing before money changes hands.
      - {id: sponsorship, type: select, required: true, scores: false,
         options: [self_funded, employer_sponsored, scholarship_requested, unfunded],
         note: "NON-SCORING. Ability to pay is not merit — promoted fact, CCC 2026-08-01."}

# ---------------------------------------------------------------------------
# Swapped as a unit when F018 resolves. Nothing else in the form changes.
# ---------------------------------------------------------------------------
eligibility_policy:
  status: PARAMETER_F018_UNRESOLVED
  active_option: null
  options:
    clinical_only:
      accepts_professions: [medicine, nursing, midwifery, pharmacy, laboratory_science, allied_health]
      experience_floor_years: null
    clinical_and_non_clinical:
      accepts_professions: all
      experience_floor_years: null
    open_with_experience_floor:
      accepts_professions: all
      experience_floor_years: TO_BE_SET_BY_W07

# ---------------------------------------------------------------------------
process:
  reasonable_adjustment_route:
    status: DRAFT
    principle: >-
      An adjustment request is received and actioned by a named administrator, never by a
      reviewer. C4 is assessed on the adjusted plan. Requesting an adjustment cannot reduce a
      score — enforced as a property test in engine/admissions.py.
    steps:
      - Applicant requests an adjustment in section S6 or at any later point.
      - A named administrator, not a reviewer, records it in the restricted system.
      - The adjusted completion plan replaces the original in the reviewer's pack.
      - Reviewers never see that an adjustment was requested, only the plan they must assess.
    not_yet_established:
      - The named administrator role — depends on W09 cohort operations.
      - The appeal route if an adjustment is refused.

  reconsideration:
    status: DRAFT
    principle: >-
      An unsuccessful applicant may request reconsideration on process grounds — that the process
      was not followed — not on the ground of disagreeing with an academic judgement.
    steps:
      - Request within a stated window of the decision.
      - Reviewed by someone who took no part in the original decision.
      - Outcome recorded with reasons.
    not_yet_established:
      - The window length.
      - Who conducts it — must not be the teaching faculty (W07-01 condition 7 logic applies).

  reviewer_pool:
    principle: >-
      W07-01 condition 7. The reviewer pool is constituted SEPARATELY from the teaching faculty.
      Overlap is permitted where an individual consents to both roles; it is never assumed, and no
      person is assigned to admissions review by virtue of holding a teaching slot.
    rationale: >-
      Double scoring plus moderation is a substantial October-to-December workload. The faculty
      economics research of 2026-08-01 found that time is the largest single driver of
      teaching-faculty attrition, and that first-year faculty are the most fragile cohort.
    before_live_scoring:
      - Calibrate on all eighteen fictional cases (W07-01 condition 3).
      - Declare conflicts of interest.
