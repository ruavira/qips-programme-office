# The journey a CCC member walks.
#
# WHY THIS FILE EXISTS
# --------------------
# engine/decision_interview.py generates stations from wherever the repository is
# open. That guarantees nothing is hidden, but a list of governance items is not a
# design review. A reviewer given thirty-one parameters in a register can ANSWER
# things without ever UNDERSTANDING anything.
#
# So the walkthrough is a journey, and the stations hang off it in the place where
# the decision actually bites. The price question is met while looking at the
# application form. The observership question is met while looking at month three.
#
# This file is the narrative spine. It is DATA, deliberately: an act can be
# reordered, rewritten or split without touching the generator, and the CCC can
# challenge the spine itself.
#
# ANCHORING RULE, enforced by engine/walkthrough.py:
# every station and every review point must appear in exactly one act. Anything
# unanchored lands in the final act and is reported loudly. An item the reviewer
# never reaches is an item they were never shown.

journey:
  id: QIPS-CCC-WALKTHROUGH
  version: "0.1.0-draft"
  status: DRAFT_FOR_CCC_REVIEW
  audience: >-
    The Central Coordinating Committee. Cohort 1 of the QIPS Professional
    Programme, convened by SQHN and Partners.
  how_to_use: >-
    Walk it in order the first time. Everything is openable, everything is
    challengeable, and nothing you say here changes the programme by itself — your
    answers compile into a proposal that a human merges after you have seen it.

acts:

  - id: ACT1
    title: What this is
    lede: >-
      Before any detail: what is being built, for whom, and what it deliberately
      is not.
    narrative: >-
      A twelve-month hybrid professional programme in healthcare quality and
      patient safety, convened by SQHN and Partners, with cohort 1 running January
      to December 2027. The vocabulary of teaching-and-consumption is banned
      outright and the ban is enforced by a validator rather than by good
      intentions — see F002, which lists the forbidden words. That language sets an
      expectation of attending and receiving, and this programme asks for
      production instead. Every participant leaves having improved something real
      in their own service, evidenced across twelve artefacts.
    what_it_is_not:
      - Not something a participant attends and consumes; everyone produces.
      - Not institutionally accredited by ISQua — individual faculty involvement only.
      - Not published under any partner's name for cohort 1.
    anchors: [F001, F002, F013, F014, F021, F022, F028]

  - id: ACT2
    title: The year they will live
    lede: >-
      Twelve months, twelve artefacts, one improvement carried the whole way.
    narrative: >-
      The curriculum is designed backwards from twelve learner artefacts rather
      than forwards from a topic list. Month 1 defines a problem; month 12
      assembles the argument the previous eleven artefacts already support. The
      capstone is not a new piece of work. Measurement starts at month 3 so a run
      chart at month 9 has real data behind it.
      The published time commitment is derived from the curriculum, not chosen for
      marketing — and a validator recomputes it on every push, because a derived
      number that nobody recomputes stops being derived.
    show:
      - curriculum_spine: engine/schemas/curriculum-spine.yaml
      - time_model: derived, recomputed against F019
    anchors: [F003, F010, F011, F019, F023, ST-curriculum-spine-UA1, ST-curriculum-spine-UA5]

  - id: ACT3
    title: Inside a single month
    lede: >-
      The same four components every month, and nothing else.
    narrative: >-
      One eLearning release, one live faculty session, one small-group coaching
      call, one artefact. A month that adds a fifth component or drops one is
      refused by the validator. Artefacts are due four days before the coaching
      call so the coach arrives having read them — that four-day gap is arithmetic
      in the engine, not a promise in a document.
      Month 1 is prototyped in full and is openable here, including the live
      session plan minute by minute.
    show:
      - month_1_prototype: workstreams/W02/working/W02-months-1-2-prototype-2026-08-02.md
    anchors: [F004, F005, ST-curriculum-spine-UA3, ST-curriculum-spine-UA4]

  - id: ACT4
    title: The observership
    lede: >-
      Forty hours in a real service that is not their own.
    narrative: >-
      From month 3 to week 2 of month 4, at a site qualified against a published
      Host Site Standard. The standard is written from programme objectives rather
      than from the characteristics of sites we happen to have — so a site either
      meets it or does not, and the list of candidate sites cannot quietly define
      the bar. The artefact is the participant's own analysis, never a log of
      attendance.
      This is also the most expensive and most legally exposed part of the design,
      and the walkthrough does not soften that.
    anchors: [F006, F008, F026, ST-F007, ST-Q001, ST-curriculum-spine-UA2]

  - id: ACT5
    title: Getting in
    lede: >-
      Who applies, how they are judged, and what is deliberately not being judged.
    narrative: >-
      Applications open October 2026 and close 31 December. Six criteria summing
      to one hundred, the heaviest weight on the improvement challenge itself.
      Title, institutional standing, sponsorship, ability to pay and any request
      for reasonable adjustment do not move the score — and that is not a policy
      statement, it is a property test: every calibration case is re-scored with
      each of those fields perturbed and the score must not move.
      Several things are deliberately absent from the rubric — no pass mark, no
      cohort cap, no country allocation. Each absence is a decision the committee
      has not yet taken, and each one is a stop on this walk.
    show:
      - rubric: engine/schemas/admissions-rubric.yaml
      - application_form: engine/schemas/application-form.yaml
    anchors:
      - F012
      - ST-F018
      - ST-F025
      - ST-admissions-rubric-ABSENT-SCORE-THRESHOLD
      - ST-admissions-rubric-ABSENT-COHORT-CAP
      - ST-admissions-rubric-ABSENT-COUNTRY-ALLOCATION
      - ST-admissions-rubric-ABSENT-ELIGIBILITY-BREADTH
      - ST-application-form-PROCESS-REASONABLE-ADJUSTMENT-ROUTE-1
      - ST-application-form-PROCESS-REASONABLE-ADJUSTMENT-ROUTE-2
      - ST-application-form-PROCESS-RECONSIDERATION-1
      - ST-application-form-PROCESS-RECONSIDERATION-2
      - ST-Q006

  - id: ACT6
    title: The people who teach and coach
    lede: >-
      Coverage slots rather than named heroes, and coaching built rather than bought.
    narrative: >-
      Faculty are appointed to coverage slots with consent, conflict clearance and
      a named backup, so the programme does not depend on any individual staying
      available for twelve months. Coaching capability is built internally rather
      than bought in, because a coaching relationship that ends when a contract
      ends is not a coaching relationship.
      Faculty preparation cost is real and rises from month 2 onward, when the
      session requires reading the whole cohort's prior artefacts. That cost is
      recorded here rather than discovered in February.
    anchors: [F009, ST-F029, ST-Q005]

  - id: ACT7
    title: Where the country question really bites
    lede: >-
      Country-agnostic in design is not country-agnostic in recognition.
    narrative: >-
      The curriculum teaches improvement applied in the participant's own facility,
      so the teaching is country-agnostic by construction — only worked examples,
      regulatory references, host-site logistics and session timing vary.
      Recognition is a different matter entirely, and the research found the
      differences are commercial and structural rather than administrative: Ghana's
      CPD technical committees sit only three times a year, Ghana's allied-health
      regulator takes a share of gross proceeds, and no Nigerian body currently
      accredits CPD for non-clinical quality professionals — who are a core part of
      the intended audience.
    anchors: [ST-F020, ST-Q002, ST-Q003]

  - id: ACT8
    title: What it costs and whether it survives
    lede: >-
      The money, stated openly, with the evidence and the ceilings.
    narrative: >-
      Nothing about the programme's design depends on the price — not one hour of
      curriculum, assessment or observership. That is why price is held open rather
      than guessed. What the research does provide is a recommended structure: a
      ladder published openly by World Bank income band, after the ISQua
      precedent, payable in instalments and quoted in local currencies after the
      West African College of Physicians precedent.
      The viability question and the go/no-go gate sit here too, including the one
      figure in the model that is still a zero.
    anchors:
      - ST-F024
      - ST-admissions-rubric-ABSENT-PRICE
      - F027
      - ST-Q004
      - ST-Q007

  - id: ACT9
    title: How this is governed, including this conversation
    lede: >-
      Why you are being asked rather than told, and what happens to what you say.
    narrative: >-
      Canon is the only thing that is true, and only a human committee decision
      writes to it. Every parameter here is deliberately open and the build is
      valid across its whole declared range — nothing is hardwired waiting for you
      to rubber-stamp it.
      What you say in this walkthrough compiles into a proposal: a structured
      change set plus a draft minute, which passes every validator and then waits
      for a human to merge it. Your reasons are kept, not just your verdicts,
      because a reason becomes a standing constraint that stops the engine
      re-proposing what you already refused.
      And every decision is reopenable. Nothing here is a one-way door.
    anchors: [F016, ST-F017, ST-Q008, ST-Q009, ST-Q010]

  - id: ACT10
    title: Anything not yet placed
    lede: >-
      Items the spine has not found a home for. Their presence here is a defect in
      the spine, not in the item — but they are shown, because an item you never
      reach is an item you were never shown.
    narrative: >-
      This act should be empty. engine/walkthrough.py reports whatever lands here.
    catch_all: true
    anchors: []
