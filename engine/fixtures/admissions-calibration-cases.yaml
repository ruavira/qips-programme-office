# Eighteen fictional admissions calibration cases.
#
# Required by W07-01 condition 3: "Before live scoring, reviewers calibrate on the eighteen
# fictional cases and declare conflicts."
#
# EVERY CASE IS FICTIONAL. There is no real applicant data here and there never may be — these
# fixtures live in a public repository. The profiles exist to test that the instrument behaves as
# designed, chiefly that prestige, sponsorship, ability to pay and adjustment need do not move a
# score. SYN-C and SYN-F carry deliberately impressive titles and funding precisely so that the
# invariant test in engine/admissions.py has something to bite on.
#
# published_total_a / _b are the totals recorded in the calibration rounds of 2026-07-28
# (workstreams/W07/working/synthetic-admissions-calibration.md and
# run-001-extended-admissions-calibration.md). The engine reproduces them or the build fails.
#
# Ratings are in criterion order C1..C6: relevance, improvement challenge, initiative and
# follow-through, protected time and completion plan, reflection, contribution.

